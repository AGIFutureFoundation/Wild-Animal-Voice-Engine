name: Build & push Perch endpoint image

# Builds the Perch inference container and pushes it to GitHub Container
# Registry (GHCR). The resulting image is what gets deployed to Akash.
on:
  push:
    branches: [ main, perch-endpoint ]
    paths:
      - "perch-endpoint/**"
      - ".github/workflows/build-perch-endpoint.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wave-perch-endpoint

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./perch-endpoint
          file: ./perch-endpoint/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed: ${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "Set this image in perch-endpoint/deploy.sdl.yaml, then deploy to Akash." >> $GITHUB_STEP_SUMMARY
