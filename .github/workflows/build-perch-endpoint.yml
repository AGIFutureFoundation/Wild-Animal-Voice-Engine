name: Build & push Perch endpoint image

# Builds the Perch inference container and pushes it to GitHub Container
# Registry (GHCR). The resulting image is what gets deployed to Akash.
on:
  push:
    branches: [ main, perch-endpoint ]
    paths:
      - "perch-endpoint/**"
      - ".github/workflows/build-perch-endpoint.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wave-perch-endpoint" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./perch-endpoint
          file: ./perch-endpoint/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.img.outputs.ref }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "Set this image in perch-endpoint/deploy.sdl.yaml, then deploy to Akash." >> $GITHUB_STEP_SUMMARY
